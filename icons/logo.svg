<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Caterpillar body segments -->
  <!-- Tail segment -->
  <ellipse cx="20" cy="82" rx="12" ry="11" fill="#6BCB4A" stroke="#3D8C2E" stroke-width="1.5"/>
  <!-- Body segment 4 -->
  <ellipse cx="36" cy="76" rx="13" ry="12" fill="#7ED95C" stroke="#3D8C2E" stroke-width="1.5"/>
  <!-- Body segment 3 -->
  <ellipse cx="54" cy="72" rx="14" ry="13" fill="#6BCB4A" stroke="#3D8C2E" stroke-width="1.5"/>
  <!-- Body segment 2 -->
  <ellipse cx="73" cy="70" rx="15" ry="14" fill="#7ED95C" stroke="#3D8C2E" stroke-width="1.5"/>
  <!-- Body segment 1 (near head) -->
  <ellipse cx="92" cy="66" rx="14" ry="14" fill="#6BCB4A" stroke="#3D8C2E" stroke-width="1.5"/>

  <!-- Head -->
  <circle cx="108" cy="54" r="18" fill="#7ED95C" stroke="#3D8C2E" stroke-width="2"/>

  <!-- Antennae -->
  <path d="M102 38 Q98 22 90 16" stroke="#3D8C2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <circle cx="88" cy="14" r="4" fill="#FF6B9D"/>
  <path d="M114 38 Q118 22 126 18" stroke="#3D8C2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <circle cx="127" cy="16" r="4" fill="#FF6B9D"/>

  <!-- Sunglasses -->
  <!-- Bridge -->
  <path d="M100 52 Q108 48 116 52" stroke="#1A1A2E" stroke-width="2.5" fill="none"/>
  <!-- Left lens -->
  <rect x="88" y="47" width="14" height="10" rx="3" ry="3" fill="#1A1A2E"/>
  <rect x="89" y="48" width="5" height="3" rx="1" fill="#3A3A5E" opacity="0.4"/>
  <!-- Right lens -->
  <rect x="106" y="47" width="14" height="10" rx="3" ry="3" fill="#1A1A2E"/>
  <rect x="107" y="48" width="5" height="3" rx="1" fill="#3A3A5E" opacity="0.4"/>
  <!-- Left arm -->
  <line x1="88" y1="52" x2="82" y2="50" stroke="#1A1A2E" stroke-width="2" stroke-linecap="round"/>
  <!-- Right arm -->
  <line x1="120" y1="52" x2="126" y2="50" stroke="#1A1A2E" stroke-width="2" stroke-linecap="round"/>

  <!-- Smile -->
  <path d="M103 62 Q108 67 113 62" stroke="#3D8C2E" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Cheeks -->
  <circle cx="97" cy="61" r="3" fill="#FF9ECB" opacity="0.5"/>
  <circle cx="119" cy="61" r="3" fill="#FF9ECB" opacity="0.5"/>

  <!-- Little feet -->
  <ellipse cx="20" cy="93" rx="4" ry="3" fill="#3D8C2E"/>
  <ellipse cx="36" cy="88" rx="4" ry="3" fill="#3D8C2E"/>
  <ellipse cx="54" cy="85" rx="4" ry="3" fill="#3D8C2E"/>
  <ellipse cx="73" cy="84" rx="4" ry="3" fill="#3D8C2E"/>
  <ellipse cx="92" cy="80" rx="4" ry="3" fill="#3D8C2E"/>

  <!-- Spots on body -->
  <circle cx="36" cy="74" r="3" fill="#5AB83A" opacity="0.6"/>
  <circle cx="54" cy="70" r="3.5" fill="#5AB83A" opacity="0.6"/>
  <circle cx="73" cy="68" r="3.5" fill="#5AB83A" opacity="0.6"/>
  <circle cx="92" cy="64" r="3" fill="#5AB83A" opacity="0.6"/>
</svg>
